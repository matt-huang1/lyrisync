<!-- Menu bar glyph, practice: the three lyric rows with a dot beside
     them. A loop, an echo pass or a tap-to-sync is running.

     The bars are unchanged and the dot sits in the corner they leave
     empty, so the difference is a mark appearing rather than the glyph
     being redrawn — the one kind of change that survives being 16 points
     tall. The rows are shortened by two units on the right to keep the
     dot from crowding them.

     A macOS template image: solid black, shape carried entirely by the
     alpha channel, so the system tints it for light and dark menu bars.
     Keep it black; do not add colour — the accent is the dot, not a
     hue, because a coloured menu bar icon stops following the menu bar. -->
<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 22 22">
  <g fill="#000000">
    <rect x="4" y="5" width="10" height="2" rx="1"/>
    <rect x="0" y="9.5" width="18" height="3" rx="1.5"/>
    <rect x="4" y="15" width="10" height="2" rx="1"/>
    <circle cx="18.5" cy="18.5" r="3"/>
  </g>
</svg>
