<!-- Menu bar glyph, idle: the same three lyric rows as menubar.svg, at
     lower alpha. Nothing is playing, or the lyrics are hidden.

     The shape is deliberately identical to the active glyph — only the
     ink changes. Two different shapes would be two icons; one shape at
     two strengths is one icon that is doing more or less.

     A macOS template image: solid black, shape carried entirely by the
     alpha channel, so the system tints it for light and dark menu bars
     and this file's fill-opacity comes through as a dimmer glyph rather
     than a grey one. Keep it black; do not add colour. -->
<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 22 22">
  <g fill="#000000" fill-opacity="0.4">
    <rect x="6" y="5" width="10" height="2" rx="1"/>
    <rect x="2" y="9.5" width="18" height="3" rx="1.5"/>
    <rect x="6" y="15" width="10" height="2" rx="1"/>
  </g>
</svg>
