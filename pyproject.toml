[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sottovoce"
version = "1.2.0"
description = "Synced lyrics for the Spotify desktop app on macOS"
requires-python = ">=3.12"
# PySide6 is only imported by the window; monitor, provider, and sync
# stay stdlib-only.
dependencies = [
    "PySide6>=6.8",
    # Native NSWindow collection behaviour (show-on-all-desktops); Qt has
    # no cross-platform API for macOS Spaces.
    "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
    # SMAppService, for Open at Login. Separate from Cocoa because pyobjc
    # ships one package per framework.
    "pyobjc-framework-ServiceManagement>=10.0; sys_platform == 'darwin'",
    # CGWindowListCopyWindowInfo, to see when a notification is over the
    # window. Needs no permission (see notifications.py) and is the only
    # thing this pulls in from Quartz.
    "pyobjc-framework-Quartz>=10.0; sys_platform == 'darwin'",
    # Revised Romanization for the Korean pronunciation line.
    "korean-romanizer>=0.25",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Only needed to build the .app bundle (`make app`); the app itself does
# not depend on it, and CI never installs it.
build = ["pyinstaller>=6.10"]

[project.scripts]
sottovoce = "sottovoce.window:main"
sottovoce-monitor = "sottovoce.monitor_cli:main"
sottovoce-lyrics = "sottovoce.lyrics_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sottovoce"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Three tiers, and every test is in exactly one of them, so each can be
# run on its own: `pytest -m unit`, `-m integration`, `-m qt`. A module
# declares its tier with a TIER line and a test overrides it with a
# marker; tests/conftest.py resolves the two and refuses a test in no
# tier.
markers = [
    "unit: one Qt-free module's own logic, its collaborators stubbed",
    "integration: this app's real parts wired to each other, only the outside world faked, driven from the entry point a user's actions arrive at",
    "qt: needs a Qt object to answer — the widget tree, a QSettings round trip, a painted image",
]
