name: tests

on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      # No display on the runner. The window tests drive a real Qt object
      # tree, so they need a platform plugin that works headless.
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt system libraries
        # PySide6's wheel imports fine without these and then fails at load
        # with "libEGL.so.1: cannot open shared object file". The offscreen
        # plugin needs EGL/GL and fontconfig; the xcb set is here so a
        # runner that ever falls back to xcb still works.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libdbus-1-3 \
            libfontconfig1 \
            libfreetype6 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0
      - run: pip install -e ".[dev]"
      - name: Check Qt can start headless
        # Fail loudly here rather than letting the window tests quietly skip.
        run: |
          python -c "
          from PySide6.QtWidgets import QApplication
          app = QApplication([])
          print('Qt platform:', QApplication.platformName())
          assert QApplication.platformName() == 'offscreen'
          "
      # -rs lists any skip with its reason, so a silently skipped module
      # cannot hide behind a green tick.
      - run: pytest -rs --junitxml=report.xml
      - name: Confirm nothing was skipped
        # The whole point of installing Qt above is that CI runs the same
        # tests a developer runs. No test is macOS-only today, so any skip
        # here means a module failed to import and quietly opted out. If a
        # genuinely platform-specific test is ever added, mark it with an
        # explicit skipif and raise the allowance below deliberately.
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("report.xml").getroot()
          suite = root if root.tag == "testsuite" else root.find("testsuite")
          total = int(suite.get("tests"))
          skipped = int(suite.get("skipped"))
          print(f"{total} tests collected, {skipped} skipped")
          assert skipped == 0, f"{skipped} test(s) skipped in CI — see the -rs list above"
          PY
